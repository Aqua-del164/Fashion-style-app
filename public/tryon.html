<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Virtual Try-On Studio | Lumière Atelier</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        .upload-section {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-top: 30px;
        }

        .upload-box {
            flex: 1;
            border: 2px dashed #3498db;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .upload-box:hover {
            background: #ecf0f1;
        }

        .upload-box input[type="file"] {
            display: none;
        }

        .preview-img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            display: none; /* Hidden by default */
            margin-top: 10px;
        }

        .placeholder-text {
            color: #7f8c8d;
        }

        .generate-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #27ae60;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 30px;
            transition: background 0.2s;
        }

        .generate-btn:hover {
            background-color: #219150;
        }

        .generate-btn:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }

        .result-section {
            margin-top: 40px;
            text-align: center;
        }

        #resultImage {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: none;
        }

        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none; /* Hidden by default */
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-msg {
            color: #c0392b;
            background-color: #fadbd8;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        
        .header-links {
            text-align: left;
            margin-bottom: 20px;
        }
        
        .header-links a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-links">
        <a href="http://localhost:3000">← Back to Price Comparison</a>
    </div>
    
    <h1>AI Virtual Try-On Studio</h1>
    <p style="text-align: center; color: #7f8c8d;">Upload your photo and an outfit screenshot to generate a visualization of the outfit on you.</p>

    <div class="upload-section">
        <!-- User Photo Upload -->
        <div class="upload-box" onclick="document.getElementById('userPhotoInput').click()">
            <input type="file" id="userPhotoInput" accept="image/*" onchange="previewImage(this, 'userPreview')">
            <div class="placeholder-text" id="userPrompt">
                <h3>1. Your Photo</h3>
                <p>Click to upload a clear photo of yourself.</p>
            </div>
            <img id="userPreview" class="preview-img" alt="User Preview">
        </div>

        <!-- Outfit Screenshot Upload -->
        <div class="upload-box" onclick="document.getElementById('outfitPhotoInput').click()">
            <input type="file" id="outfitPhotoInput" accept="image/*" onchange="previewImage(this, 'outfitPreview')">
            <div class="placeholder-text" id="outfitPrompt">
                <h3>2. Outfit Screenshot</h3>
                <p>Click to upload the screenshot of the outfit.</p>
            </div>
            <img id="outfitPreview" class="preview-img" alt="Outfit Preview">
        </div>
    </div>

    <button class="generate-btn" id="generateBtn" onclick="generateTryOn()">Generate Synthesized Try-On ✨</button>

    <div class="result-section">
        <div class="loader" id="loader"></div>
        <div class="error-msg" id="errorMsg"></div>
        <img id="resultImage" alt="Synthesized Try-On Result">
    </div>
</div>

<script>
    function previewImage(input, previewId) {
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            
            // Update the prompt text based on which box was uploaded
            const boxId = previewId === 'userPreview' ? 'userPrompt' : 'outfitPrompt';
            document.getElementById(boxId).style.display = 'none';

            reader.onload = function(e) {
                const preview = document.getElementById(previewId);
                preview.src = e.target.result;
                preview.style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    }

    async function generateTryOn() {
        const userFile = document.getElementById('userPhotoInput').files[0];
        const outfitFile = document.getElementById('outfitPhotoInput').files[0];

        // Validation
        if (!userFile || !outfitFile) {
            alert("Please upload both a photo of yourself and an outfit screenshot.");
            return;
        }

        // UI State: Loading
        const generateBtn = document.getElementById('generateBtn');
        const loader = document.getElementById('loader');
        const resultImg = document.getElementById('resultImage');
        const errorMsg = document.getElementById('errorMsg');

        generateBtn.disabled = true;
        generateBtn.innerText = "Generating (This may take 10-20 seconds)...";
        loader.style.display = "block";
        resultImg.style.display = "none";
        errorMsg.style.display = "none";

        // Prepare Form Data
        const formData = new FormData();
        formData.append('userPhoto', userFile);
        formData.append('outfitPhoto', outfitFile);

        try {
            // Send to Backend Server (Running on port 3002)
            const response = await fetch('http://localhost:3002/api/synthesize-tryon', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            // UI State: Reset Button
            generateBtn.disabled = false;
            generateBtn.innerText = "Generate Synthesized Try-On ✨";
            loader.style.display = "none";

            if (data.success) {
                // Display Generated Image
                resultImg.src = data.imageUrl;
                resultImg.style.display = "block";
            } else {
                // Display Error
                errorMsg.innerText = "Error: " + data.error;
                errorMsg.style.display = "block";
            }

        } catch (error) {
            // Handle Network or JSON parsing errors
            generateBtn.disabled = false;
            generateBtn.innerText = "Generate Synthesized Try-On ✨";
            loader.style.display = "none";
            errorMsg.innerText = "An unexpected error occurred: " + error.message;
            errorMsg.style.display = "block";
        }
    }
</script>

</body>
</html>
