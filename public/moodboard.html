<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Style Mood Board | Lumière Atelier</title>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfbf9; color: #2c2825; margin: 0; padding: 24px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 32px; border-radius: 20px; border: 1px solid #e8dfd5; }
        .btn-dark { background-color: #2c2825; color: white; padding: 12px 24px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; width: 100%; margin-top: 12px; }
        .output-box { margin-top: 24px; background: #f4efe6; padding: 20px; border-radius: 12px; white-space: pre-line; line-height: 1.6; font-size: 14px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="http://localhost:3000" style="color: #2c2825; font-weight: bold; text-decoration: none;">← Home</a>
        <h2>Style Mood Board & Trend Tracker 📌</h2>
        <p style="color: #6b635b;">Upload any Pinterest lookbook image to extract aesthetic keywords and styling breakdowns.</p>

        <input type="file" id="moodFile" accept="image/*" style="margin-top: 12px;">
        <button class="btn-dark" onclick="analyzeMoodBoard()">Analyze Inspiration 🎨</button>

        <div class="output-box" id="moodOutput"></div>
    </div>
    <script>
        async function analyzeMoodBoard() {
            const file = document.getElementById('moodFile').files[0];
            const outputBox = document.getElementById('moodOutput');
            if (!file) { alert("Please upload an inspiration image!"); return; }
            outputBox.style.display = 'block';
            outputBox.innerText = "Analyzing aesthetic trends and color harmony...";

            const formData = new FormData();
            formData.append('moodBoardImage', file);

            const res = await fetch('http://localhost:3002/api/moodboard-tracker', { method: 'POST', body: formData });
            const data = await res.json();
            outputBox.innerText = data.success ? data.analysis : "Error: " + data.error;
        }
    </script>
</body>
</html>
