<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fashion Coach | Lumière Atelier</title>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfbf9; color: #2c2825; margin: 0; padding: 24px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 32px; border-radius: 20px; border: 1px solid #e8dfd5; }
        .btn-dark { background-color: #2c2825; color: white; padding: 12px 24px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; font-size: 15px; margin-top: 16px; width: 100%; }
        .btn-dark:hover { background-color: #423c38; }
        .output-box { margin-top: 24px; background: #f4efe6; padding: 20px; border-radius: 12px; white-space: pre-line; line-height: 1.6; font-size: 14px; color: #423c38; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div style="margin-bottom: 16px;"><a href="http://localhost:3000" style="color: #2c2825; font-weight: bold; text-decoration: none;">← Home</a></div>
        <h2>AI Fashion Coach & Outfit Rating 🖤</h2>
        <p style="color: #6b635b;">Upload a photo of your current outfit to receive a professional styling review, score, and elevation tips.</p>

        <div style="margin-top: 20px;">
            <input type="file" id="coachPhotoInput" accept="image/*">
        </div>

        <button class="btn-dark" onclick="submitOutfitForRating()">Get Style Critique ✨</button>

        <div class="output-box" id="coachOutput"></div>
    </div>

    <script>
        async function submitOutfitForRating() {
            const fileInput = document.getElementById('coachPhotoInput').files[0];
            const outputBox = document.getElementById('coachOutput');

            if (!fileInput) {
                alert("Please upload a photo of your outfit first!");
                return;
            }

            outputBox.style.display = 'block';
            outputBox.innerText = "Analyzing your outfit colors, fit, and aesthetic balance...";

            const formData = new FormData();
            formData.append('outfitCheckPhoto', fileInput);

            try {
                const response = await fetch('http://localhost:3002/api/rate-outfit', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.success) {
                    outputBox.innerText = data.critique;
                } else {
                    outputBox.innerText = "Error: " + data.error;
                }
            } catch (err) {
                outputBox.innerText = "Network error: " + err.message;
            }
        }
    </script>
</body>
</html>
