<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Wardrobe | Lumière Atelier</title>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfbf9; color: #2c2825; margin: 0; padding: 24px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 32px; border-radius: 20px; border: 1px solid #e8dfd5; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; margin-top: 24px; }
        .item-card { background: #f4efe6; border-radius: 12px; padding: 12px; text-align: center; }
        .item-card img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; }
        .btn { background: #2c2825; color: #fcfbf9; padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>My Digital Wardrobe</h2>
            <a href="http://localhost:3000" style="color: #2c2825; font-weight: bold; text-decoration: none;">← Home</a>
        </div>
        <p style="color: #6b635b; font-size: 14px;">Upload your physical clothes, jewelry, shoes, and bags to build your closet database.</p>
        
        <form action="/api/upload-wardrobe" method="POST" enctype="multipart/form-data" style="margin-top: 20px; display: flex; gap: 12px;">
            <input type="file" name="itemImage" accept="image/*" required>
            <select name="category" style="padding: 8px; border-radius: 6px;">
                <option value="tops">Tops & Shirts</option>
                <option value="bottoms">Bottoms & Skirts</option>
                <option value="shoes">Shoes & Boots</option>
                <option value="jewelry">Jewelry & Accessories</option>
            </select>
            <button type="submit" class="btn">Add to Closet</button>
        </form>

        <div class="grid" id="wardrobeGrid">
            <!-- Dynamically populated wardrobe items will appear here -->
        </div>
    </div>
</body>
</html>
